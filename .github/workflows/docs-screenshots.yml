name: Refresh docs screenshots

# semantic-release publishes with the default GITHUB_TOKEN, which does not
# trigger this `release` event. release.yml calls this workflow directly
# after a version is cut. workflow_dispatch and a manually published release
# still work on their own.
on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: npm run docs:screenshots

      - name: Open or update the screenshot pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: refresh screenshots"
          branch: docs/screenshot-refresh
          delete-branch: true
          title: "docs: refresh screenshots"
          body: |
            Automated refresh of the docs screenshots from the demo build.

            Generated by `npm run docs:screenshots`. Filenames are listed in `docs-site/public/docs/images/screenshots/README.md`.
          add-paths: |
            docs-site/public/docs/images/screenshots/**
