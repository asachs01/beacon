name: Deploy Docs to Cloudflare Pages

# Same triggers and docs build as deploy-docs.yml. Leave that push workflow
# in place until cutover: Pages live on beaconfamily.app with SITE_URL set,
# then one manual Netlify redirect deploy (deploy-docs-netlify-redirect.yml).
# Keep the Netlify site. Remove deploy-docs.yml only in a later follow-up,
# or a docs push will publish a full site over the redirect.
#
# SITE_URL is only the repository variable. When it is unset or blank,
# docs-site/site.config.mjs keeps its current default host. Do not default
# it to the custom domain in this workflow.
#
# The deploy job is skipped (the workflow still succeeds) when
# CLOUDFLARE_API_TOKEN is missing, including pull requests from forks.

on:
  push:
    branches: [main]
    paths: ['docs-site/**']
  pull_request:
    branches: [main]
    paths: ['docs-site/**']
  workflow_dispatch:

jobs:
  guard:
    name: Check Cloudflare token
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.cloudflare.outputs.enabled }}
    steps:
      - name: Skip unless CLOUDFLARE_API_TOKEN is set
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not set. Skipping Cloudflare Pages deploy."
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build docs
        working-directory: docs-site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Check docs site URLs match SITE_URL
        working-directory: docs-site
        run: npm run check:urls
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # Push to main and workflow_dispatch publish the production branch.
      # pull_request publishes the head branch so Pages treats it as a preview
      # when the project's production branch is main. --commit-dirty lets the
      # deploy proceed after wrangler-action installs wrangler into the repo.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from docs-site/ so wrangler bundles docs-site/functions/
          # (the www -> apex redirect middleware) with the static build.
          workingDirectory: docs-site
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'beacon-docs' }} --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }} --commit-dirty=true
