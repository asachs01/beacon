name: Build & Publish Add-on

# Manual tags and GitHub releases created outside semantic-release.
# Releases cut from main publish the image in scripts/prepare-addon-release.sh
# before the version bump is pushed. This workflow uses the same order: the
# image push step is above the version-sync commit, so a failed push never
# updates beacon/config.yaml on main.

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: asachs01/beacon
  BUILD_FROM: ghcr.io/hassio-addons/base:16.3.2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: tag_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Local edit only. It is committed after the image push succeeds.
      - name: Sync beacon/config.yaml to tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sed -i "s/^version:.*/version: \"${{ steps.tag_version.outputs.version }}\"/" beacon/config.yaml

      - name: Read version to build
        id: version
        run: |
          VERSION=$(grep '^version:' beacon/config.yaml | sed -E 's/version:[[:space:]]*"?([^"]*)"?/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: beacon
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            BUILD_FROM=${{ env.BUILD_FROM }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Commit synced beacon/config.yaml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add beacon/config.yaml
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:main || true
