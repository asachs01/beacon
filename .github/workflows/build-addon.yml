name: Build & Publish Add-on

on:
  workflow_call:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  # Manual builds (Actions -> "Build & Publish Add-on" -> Run workflow).
  # Lets a feature branch produce a runnable image without merging to main;
  # the tagging step below keeps such a build off the `latest` tag.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Derived from the repo owner so forks publish to their own namespace.
  # GHCR requires a lowercase repository path; GitHub usernames with
  # uppercase letters would need to be written out in lowercase instead.
  IMAGE_NAME: ${{ github.repository_owner }}/beacon

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # actions/checkout@v4 defaults to github.sha, which is PINNED to
      # whatever commit triggered this workflow run. When invoked via
      # workflow_call right after the `release` job, semantic-release has
      # already pushed a NEW commit (the version bump to config.yaml) --
      # but that new commit is invisible to this checkout unless we
      # explicitly ask for the branch HEAD instead of the frozen sha.
      # Without this, the image gets built one version behind every time
      # (confirmed: v1.32.3's release run built and tagged the image as
      # 1.32.2, the pre-bump version, because of exactly this).
      #
      # github.ref_name is 'main' for the workflow_call path (the caller was
      # triggered by a push to main) and a tag name (e.g. 'v1.32.3') for the
      # legacy manual release/push-tag path -- so it reliably distinguishes
      # the two cases without relying on github.event_name, which doesn't
      # behave as expected inside a called reusable workflow (see PR #9).
      - name: Checkout (post-release main HEAD)
        if: github.ref_name == 'main'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout (manual release/tag)
        if: github.ref_name != 'main'
        uses: actions/checkout@v4

      # release/push-tag triggers (e.g. a manually-created tag/release) may
      # predate a config.yaml version bump, so sync config.yaml to the tag
      # first. When invoked via workflow_call (our own release.yml, right
      # after semantic-release already committed the bump to main), GITHUB_REF
      # is a branch ref (refs/heads/main), not a tag — config.yaml on that
      # commit is already correct, so skip the tag-parsing/sync steps.
      #
      # NOTE: don't gate this on `github.event_name != 'workflow_call'` --
      # empirically, github.event_name inside a called reusable workflow does
      # NOT read back as 'workflow_call' the way you'd expect, so that
      # condition silently never skips. Check the actual ref shape instead.
      - name: Extract version from tag
        id: tag_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync config.yaml to tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sed -i "s/^version:.*/version: \"${{ steps.tag_version.outputs.version }}\"/" config.yaml

      - name: Read version to build
        id: version
        run: |
          VERSION=$(grep '^version:' config.yaml | sed -E 's/version:[[:space:]]*"?([^"]*)"?/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # main, a release and a v* tag all own `latest`. A workflow_dispatch run
      # on a branch must not move `latest` for everyone else's wall displays,
      # so it gets a branch-suffixed tag instead (e.g.
      # 1.42.0-feat-choreops-integration) and its own branch tag.
      - name: Compute image tags
        id: tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF" = "refs/heads/main" ] || [ "${REF#refs/tags/}" != "$REF" ]; then
            TAGS=$(printf '%s\n%s' "$IMAGE:$VERSION" "$IMAGE:latest")
          else
            SLUG=$(printf '%s' "$REF_NAME" | tr '[:upper:]/_' '[:lower:]--' | sed 's/[^a-z0-9.-]//g')
            TAGS=$(printf '%s\n%s' "$IMAGE:$VERSION-$SLUG" "$IMAGE:$SLUG")
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit synced config.yaml (release/push-tag triggers only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.yaml
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:main || true
