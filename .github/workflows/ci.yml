name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check beacon/ sync
        run: bash scripts/check-beacon-sync.sh

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Settings reference is up to date
        run: node scripts/generate-settings-reference.mjs --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build docs
        working-directory: docs-site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The published GHCR workflow builds from the repo root. Home Assistant
  # Supervisor does not: it builds beacon/Dockerfile with beacon/ as the
  # context, so root package.json can be installable while the add-on image
  # is not. Build that image on every pull request (amd64 matches the
  # reported Supervisor failure). Dependency parity is the fast check in
  # scripts/check-beacon-sync.sh; this job is the real install + vite build.
  addon-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build add-on image from beacon/
        run: docker build --platform linux/amd64 --tag beacon-addon:ci beacon/
