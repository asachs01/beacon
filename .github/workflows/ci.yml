name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check beacon/ sync
        run: bash scripts/check-beacon-sync.sh

      - name: Check add-on manifest and release image order
        run: |
          node scripts/check-addon-manifests.mjs
          node scripts/check-release-image-order.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Settings reference is up to date
        run: node scripts/generate-settings-reference.mjs --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build docs
        working-directory: docs-site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build beacon/ and start it the way Supervisor does with init: false
  # (no Docker --init, s6 entrypoint is PID 1). amd64 is native. arm64 uses QEMU.
  addon-image:
    name: Add-on image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Smoke-run add-on image
        run: bash scripts/smoke-addon-image.sh "${{ matrix.platform }}"
