name: Family
version: "1.54.0"
slug: family
description: "Family command center for wall-mounted displays"
url: "https://github.com/f1f1f1f1f1f1/Family"
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 3000
panel_icon: mdi:calendar-clock
panel_title: Family
homeassistant_api: true
hassio_api: true
auth_api: true
options:
  family_name: "My Family"
  theme: "skylight"
  auto_dark_mode: true
  weather_entity: "weather.home"
  photo_directory: "/media/beacon/photos"
  photo_interval: 30
  screen_saver_timeout: 5
schema:
  family_name: str
  theme: str
  auto_dark_mode: bool
  weather_entity: str
  photo_directory: str
  photo_interval: int
  screen_saver_timeout: int
